tasks:
  install-dependencies:
    name: Install dependencies
    description: Restore the project's NuGet dependencies.
    command: dotnet restore
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the ASP.NET Core application.
    command: dotnet build --no-restore
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies

services:
  aspnet-core-api:
    name: ASP.NET Core API
    description: Run the ASP.NET Core development server.
    commands:
      start: |
        ona environment port open 5108 --admission creator_only --name "ASP.NET Core API"
        dotnet run --no-launch-profile --urls http://0.0.0.0:5108
      ready: curl --fail --silent http://localhost:5108/
    triggeredBy:
      - manual
      - postEnvironmentStart
