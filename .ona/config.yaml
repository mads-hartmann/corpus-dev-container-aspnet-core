tasks:
  install-dependencies:
    name: Install dependencies
    command: dotnet restore
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    command: dotnet build --no-restore
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  web:
    name: ASP.NET Core web app
    commands:
      start: |
        ona environment port open 5108 --admission creator_only --name "ASP.NET Core web app"
        ASPNETCORE_ENVIRONMENT=Development dotnet run --no-launch-profile --urls http://0.0.0.0:5108
      ready: curl -fsS http://localhost:5108/
    triggeredBy:
      - manual
      - postEnvironmentStart
